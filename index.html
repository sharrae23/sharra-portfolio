<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Mary Sharra — Documentation + Operations Support</title>
    <meta
      name="description"
      content="Virtual assistance, SOPs, knowledge bases, process documentation, and operations support for growing teams."
    />
    <meta name="author" content="Mary Sharra" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#F7F4EF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preload" as="image" href="/avatar.svg" fetchpriority="high" media="(min-width: 1100px)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mary Sharra" />
    <meta property="og:title" content="Mary Sharra — Documentation + Operations Support" />
    <meta
      property="og:description"
      content="I help growing teams keep the work organized and document how it gets done."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#15121A');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
